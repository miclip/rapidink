<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Page background -->
  <rect x="8" y="4" width="44" height="56" rx="3" fill="#fff" stroke="#2d3748" stroke-width="2.5"/>
  <!-- Ruled lines -->
  <line x1="16" y1="18" x2="44" y2="18" stroke="#cbd5e0" stroke-width="1.5"/>
  <line x1="16" y1="26" x2="44" y2="26" stroke="#cbd5e0" stroke-width="1.5"/>
  <line x1="16" y1="34" x2="44" y2="34" stroke="#cbd5e0" stroke-width="1.5"/>
  <line x1="16" y1="42" x2="44" y2="42" stroke="#cbd5e0" stroke-width="1.5"/>
  <!-- Pen -->
  <g transform="translate(34, 12) rotate(35)">
    <!-- Pen body -->
    <rect x="-3" y="0" width="6" height="32" rx="1.5" fill="#4a5568"/>
    <!-- Pen clip -->
    <rect x="3" y="2" width="1.5" height="12" rx="0.75" fill="#718096"/>
    <!-- Pen tip -->
    <polygon points="-2.5,32 2.5,32 0,40" fill="#2d3748"/>
    <!-- Ink accent -->
    <circle cx="0" cy="40" r="1.5" fill="#3182ce"/>
  </g>
</svg>
